[project]
name = "ue-neural-render-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnx>=1.18,<2",
    "pillow>=11,<13",
    "torch>=2.11,<2.14",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
